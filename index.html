
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Number Guessing Game</h1>
        <p class="subtitle">Guess the secret number between 1 and 100</p>

        <div class="game-card">
            <label for="guessInput">Enter your guess</label>
            <input type="number" id="guessInput" placeholder="Enter a  number (1-100)" min="1" max="100">
            <button id="guessBtn" onclick="checkGuess()">Check Guess</button>

            <p id="message">Let's start the guessing</p>

            <div class="attempt-box">
                <span>Attempts</span>
                <h2 id="attempts">0</h2>
            </div>

            <button id="playAgainBtn" onclick="playAgain()" hidden>Play Again</button>
        </div>
        <p class="hint">Tip: Use the higher or lower hint to find the number.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
